[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart"
version = "0.1.0"
description = "Orchestration and RL environment runtime for coding agents (drives arteries + capillaries)"
requires-python = ">=3.10"

[project.scripts]
heart = "heart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# `uv sync` installs this group by default. arteries stays undeclared: heart
# imports it lazily and runs without it, and a path source here would make the
# lock fail in any clone that lacks ../arteries. Add it per run instead:
#   uv run --with-editable ../arteries --with-editable ../capillaries python -m pytest
# (`python -m`: the bare `pytest` script runs the base .venv, which can't see them)
[dependency-groups]
dev = ["pytest>=8.0"]
