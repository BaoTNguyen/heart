name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: heart

      # heart's own import of arteries is optional (episode.py guards it), but
      # two tests assert the arteries subagent contract on purpose — that seam is
      # exactly what a heart PR can break silently. Same matrix rule as the rest
      # of the stack: PR into main is judged against the siblings' main, work on
      # dev against their dev.
      - uses: actions/checkout@v4
        with:
          repository: BaoTNguyen/arteries
          ref: ${{ github.base_ref == 'main' && 'main' || 'dev' }}
          path: arteries
      - uses: actions/checkout@v4
        with:
          repository: BaoTNguyen/capillaries
          ref: ${{ github.base_ref == 'main' && 'main' || 'dev' }}
          path: capillaries

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The siblings go in editable rather than on PYTHONPATH: the contract test
      # imports arteries.compile, which reaches httpx, so a bare source checkout
      # collects and then dies on the first transitive dependency. Installing
      # from their pyprojects means adding one there does not also mean editing
      # this file. heart itself has no dependencies and stays a source checkout.
      - run: pip install -e ./capillaries -e ./arteries pytest

      - working-directory: heart
        env:
          PYTHONPATH: ${{ github.workspace }}/heart/src
        run: python -m pytest -q
