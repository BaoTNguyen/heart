name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: heart

      # heart's own import of arteries is optional (episode.py guards it), but
      # two tests assert the arteries subagent contract on purpose — that seam is
      # exactly what a heart PR can break silently. Same matrix rule as the rest
      # of the stack: PR into main is judged against the siblings' main, work on
      # dev against their dev.
      - uses: actions/checkout@v7
        with:
          repository: BaoTNguyen/arteries
          ref: ${{ github.base_ref == 'main' && 'main' || 'dev' }}
          path: arteries
      - uses: actions/checkout@v7
        with:
          repository: BaoTNguyen/capillaries
          ref: ${{ github.base_ref == 'main' && 'main' || 'dev' }}
          path: capillaries

      - uses: astral-sh/setup-uv@v10.2.0   # no floating major tags after v7
        with:
          python-version: '3.12'

      # heart's lock can't name arteries (optional, and absent in a heart-only
      # clone), so the siblings join this one run with --with-editable. Their
      # pyprojects supply their transitive deps: the contract test imports
      # arteries.compile, which reaches httpx.
      - working-directory: heart
        run: |
          uv sync
          uv run --with-editable ../capillaries --with-editable ../arteries python -m pytest -q
